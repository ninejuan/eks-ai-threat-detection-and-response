[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "mcp_server/_generated",
    "mcp_server/proto",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "S",
    "B",
    "A",
    "C4",
    "DTZ",
    "T10",
    "ISC",
    "ICN",
    "PIE",
    "PT",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "TID",
    "TCH",
    "ARG",
    "ERA",
    "PL",
    "TRY",
    "FLY",
    "PERF",
    "RUF",
]
ignore = [
    "S101",
    "TRY003",
    "TRY300",
    "TRY400",
    "PLR0913",
    "PLR2004",
    "PLC0415",
    "PERF401",
    "ERA001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S107", "ARG001", "ARG005", "PLR2004", "SLF001"]
"app/**/handler.py" = ["ARG001"]

apiVersion: v1
kind: ConfigMap
metadata:
  name: tetragon-sns-forwarder
  namespace: tetragon
  labels:
    app.kubernetes.io/name: tetragon-sns-forwarder
    app.kubernetes.io/part-of: atdr
data:
  forwarder.py: |
    import glob
    import json
    import os
    import sys
    import time

    import boto3
    from botocore.exceptions import ClientError

    SNS_TOPIC_ARN = os.environ["SNS_TOPIC_ARN"]
    REGION = os.environ.get("AWS_REGION", "ap-northeast-2")
    POLICY_FILTER = os.environ.get("POLICY_FILTER", "detect-sensitive-file-access,detect-privilege-escalation,detect-container-escape")
    NAMESPACE_EXCLUDE = os.environ.get("NAMESPACE_EXCLUDE", "kube-system,monitoring,external-secrets,falco,tetragon,atdr")

    sns = boto3.client("sns", region_name=REGION)
    policies = set(POLICY_FILTER.split(","))
    excluded_ns = set(NAMESPACE_EXCLUDE.split(","))


    def should_forward(event):
        kprobe = event.get("process_kprobe", {})
        if not kprobe:
            return False

        policy = kprobe.get("policy_name", "")
        if policy not in policies:
            return False

        proc = kprobe.get("process", {})
        pod = proc.get("pod", {})
        ns = pod.get("namespace", "")
        if ns in excluded_ns or not ns:
            return False

        return True


    def forward(event):
        try:
            sns.publish(
                TopicArn=SNS_TOPIC_ARN,
                Subject="Tetragon Security Event",
                Message=json.dumps(event, ensure_ascii=False),
            )
            print(f"Published: {event.get('process_kprobe',{}).get('policy_name','')}", flush=True)
        except ClientError as e:
            print(f"SNS publish failed: {e}", file=sys.stderr, flush=True)


    def tail_file(path):
        while not os.path.exists(path):
            time.sleep(1)

        with open(path, "r") as f:
            f.seek(0, 2)
            while True:
                line = f.readline()
                if line:
                    yield line.strip()
                else:
                    if not os.path.exists(path):
                        break
                    time.sleep(0.5)


    def main():
        log_path = sys.argv[1] if len(sys.argv) > 1 else "/var/run/cilium/tetragon/tetragon.log"
        print(f"Tetragon SNS forwarder started. Topic: {SNS_TOPIC_ARN}", flush=True)
        print(f"Watching: {log_path}", flush=True)
        print(f"Policies: {policies}", flush=True)
        print(f"Excluded namespaces: {excluded_ns}", flush=True)

        while True:
            try:
                for line in tail_file(log_path):
                    if not line:
                        continue
                    try:
                        event = json.loads(line)
                    except json.JSONDecodeError:
                        continue
                    if should_forward(event):
                        forward(event)
            except Exception as e:
                print(f"Error: {e}, restarting tail...", file=sys.stderr, flush=True)
                time.sleep(2)


    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tetragon-sns-forwarder
  namespace: tetragon
  labels:
    app.kubernetes.io/name: tetragon-sns-forwarder
    app.kubernetes.io/part-of: atdr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tetragon-sns-forwarder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tetragon-sns-forwarder
        app.kubernetes.io/part-of: atdr
    spec:
      serviceAccountName: tetragon-sns-forwarder
      containers:
        - name: forwarder
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              pip install --quiet boto3 && \
              python3 /app/forwarder.py /var/run/cilium/tetragon/tetragon.log
          env:
            - name: SNS_TOPIC_ARN
              value: ${SNS_TOPIC_ARN}
            - name: AWS_REGION
              value: ${AWS_REGION}
          volumeMounts:
            - name: export-log
              mountPath: /var/run/cilium/tetragon
              readOnly: true
            - name: forwarder-script
              mountPath: /app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            runAsNonRoot: false
      volumes:
        - name: export-log
          hostPath:
            path: /var/run/cilium/tetragon
        - name: forwarder-script
          configMap:
            name: tetragon-sns-forwarder
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tetragon-sns-forwarder
  namespace: tetragon
  labels:
    app.kubernetes.io/name: tetragon-sns-forwarder
    app.kubernetes.io/part-of: atdr

driver:
  kind: modern_ebpf

collectors:
  kubernetes:
    enabled: true

falcosidekick:
  enabled: true
  config:
    aws:
      region: ap-northeast-2
      sns:
        topicarn: ""
        rawjson: false

serviceAccount:
  create: true
  name: falcosidekick

customRules:
  atdr-rules.yaml: |-
    - rule: Terminal shell in container
      desc: A shell was used as the entrypoint/exec point into a container
      condition: >
        spawned_process and container
        and shell_procs and proc.tty != 0
        and container_entrypoint
      output: >
        Shell opened in container
        (user=%user.name user_loginuid=%user.loginuid
        shell=%proc.name parent=%proc.pname cmdline=%proc.cmdline
        pid=%proc.pid terminal=%proc.tty container_id=%container.id
        image=%container.image.repository)
      priority: WARNING
      tags: [container, shell, mitre_execution]

    - rule: Outbound connection to crypto mining pool
      desc: Detect outbound connections to known crypto mining pools
      condition: >
        outbound and fd.sip.name in (crypto_mining_pools)
      output: >
        Outbound connection to crypto mining pool
        (user=%user.name command=%proc.cmdline pid=%proc.pid
        connection=%fd.name container_id=%container.id
        image=%container.image.repository)
      priority: CRITICAL
      tags: [network, crypto, mitre_impact, T1496]

    - rule: Read sensitive file in container
      desc: Sensitive file read in container (e.g., /etc/shadow, /etc/passwd)
      condition: >
        open_read and container
        and (fd.name startswith /etc/shadow or fd.name startswith /etc/passwd)
      output: >
        Sensitive file read in container
        (user=%user.name command=%proc.cmdline file=%fd.name
        container_id=%container.id image=%container.image.repository)
      priority: WARNING
      tags: [filesystem, mitre_credential_access]

    - rule: Sensitive mount detected
      desc: Container started with sensitive host path mount
      condition: >
        spawned_process and container
        and proc.name in (mount, umount)
      output: >
        Sensitive mount operation in container
        (user=%user.name command=%proc.cmdline
        container_id=%container.id image=%container.image.repository)
      priority: WARNING
      tags: [container, mount, mitre_privilege_escalation]

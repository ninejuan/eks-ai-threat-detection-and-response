apiVersion: v1
kind: ServiceAccount
metadata:
  name: eks-mcp-server
  namespace: atdr
  labels:
    app.kubernetes.io/name: eks-mcp-server
    app.kubernetes.io/part-of: atdr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atdr-eks-mcp-server
  labels:
    app.kubernetes.io/name: eks-mcp-server
    app.kubernetes.io/part-of: atdr
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumendpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atdr-eks-mcp-server
  labels:
    app.kubernetes.io/name: eks-mcp-server
    app.kubernetes.io/part-of: atdr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atdr-eks-mcp-server
subjects:
  - kind: ServiceAccount
    name: eks-mcp-server
    namespace: atdr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-mcp-server
  namespace: atdr
  labels:
    app.kubernetes.io/name: eks-mcp-server
    app.kubernetes.io/part-of: atdr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eks-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eks-mcp-server
        app.kubernetes.io/part-of: atdr
    spec:
      serviceAccountName: eks-mcp-server
      containers:
        - name: server
          image: ${MCP_IMAGE}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-auth-token
                  key: token
            - name: MCP_PORT
              value: "8080"
            - name: FORENSICS_BUCKET
              value: ${FORENSICS_BUCKET}
            - name: TETRAGON_EVENTS_TABLE
              value: ${TETRAGON_EVENTS_TABLE}
            - name: EKS_AUDIT_LOG_GROUP
              value: ${EKS_AUDIT_LOG_GROUP}
            - name: AWS_REGION
              value: ${AWS_REGION}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: eks-mcp-server
  namespace: atdr
  labels:
    app.kubernetes.io/name: eks-mcp-server
    app.kubernetes.io/part-of: atdr
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-security-groups: ${MCP_NLB_SECURITY_GROUP_ID}
    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "true"
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - ${VPC_CIDR}
  selector:
    app.kubernetes.io/name: eks-mcp-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: eks-mcp-server-ingress
  namespace: atdr
  labels:
    app.kubernetes.io/name: eks-mcp-server
    app.kubernetes.io/part-of: atdr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: eks-mcp-server
  ingress:
    - fromCIDRSet:
        - cidr: ${VPC_CIDR}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
